# NGINX: HTTPS sonlandırma + SPECTRE sunucusuna yönlendirme (WebSocket dahil).
server {
    listen 443 ssl http2;
    server_name oyun.alanadin.com;

    # ssl_certificate     /etc/letsencrypt/live/oyun.alanadin.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/oyun.alanadin.com/privkey.pem;

    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
