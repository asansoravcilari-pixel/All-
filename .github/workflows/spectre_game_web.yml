name: SPECTRE Oyun - Test ve Web (WASM)

on:
  push:
    paths:
      - "spectre_game/**"
      - ".github/workflows/spectre_game_web.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Cekirdek - analiz ve test
        working-directory: spectre_game/packages/spectre_core
        run: dart pub get && dart analyze && dart test

      - name: Sunucu - analiz ve test
        working-directory: spectre_game/server
        run: dart pub get && dart analyze && dart test

      - name: Uygulama - analiz ve test
        working-directory: spectre_game
        run: flutter pub get && flutter analyze && flutter test

      - name: WebAssembly derle
        working-directory: spectre_game
        run: flutter build web --wasm --release

      - name: Sunucuyu derle
        working-directory: spectre_game/server
        run: dart compile exe bin/server.dart -o ../build/spectre-server

      - uses: actions/upload-artifact@v4
        with:
          name: spectre-game
          path: |
            spectre_game/build/web
            spectre_game/build/spectre-server
